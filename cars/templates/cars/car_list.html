{% extends "cars/base.html" %}
{% block content %}
<h1>Carros disponíveis</h1>
{% for car in cars %}
    <div>
        <h2>{{ car.brand }} {{ car.model }} ({{ car.year }})</h2>
        <p>Preço: €{{ car.price }}</p>
        <a href="{% url 'car_detail' car.pk %}">Ver detalhes</a>
    </div>
{% empty %}
    <p>Nenhum carro disponível.</p>
{% endfor %}
{% endblock %}
